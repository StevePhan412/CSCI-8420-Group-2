# CI: checks the team's markdown docs (Proposal.md, README.md, etc.)
# on every push/PR to main — catches broken links and formatting slip-ups
# before they land in the doc you're actually submitting.
 
name: CI
 
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
 
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
 
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Checks all markdown files in the repo for broken links and formatting issues
  check-docs:
    runs-on: ubuntu-latest
 
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
 
      # Checks every markdown file (Proposal.md, README.md, wiki pages you keep in-repo, etc.)
      # for dead links — http(s) links that 404 or don't resolve.
      - name: Check for broken links in markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc_config.json'
 
      # Lints markdown formatting (headers, list style, stray whitespace, etc.)
      # using the lenient ruleset in .markdownlint.json so it flags real
      # mistakes without nitpicking prose style.
      - name: Lint markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
